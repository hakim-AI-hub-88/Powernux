<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Powernux — The modular productivity toolkit for Linux">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b24"/>
      <stop offset="0.55" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#12102e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F6FF"/>
      <stop offset="0.6" stop-color="#bfeeff"/>
      <stop offset="1" stop-color="#00C2FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00C2FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00C2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>
  <style>
    .star { fill: #F4F6FF; animation: twinkle 4s ease-in-out infinite; }
    .s2 { animation-delay: 1.3s; } .s3 { animation-delay: 2.6s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: 230px 170px; }
    @keyframes pulse { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .fade { animation: fadein 1.2s ease-out both; }
    .fade2 { animation: fadein 1.2s 0.35s ease-out both; }
    .fade3 { animation: fadein 1.2s 0.7s ease-out both; }
    @keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <!-- étoiles -->
    <circle class="star" cx="80" cy="60" r="1.6"/><circle class="star s2" cx="460" cy="40" r="1.2"/>
    <circle class="star s3" cx="640" cy="300" r="1.4"/><circle class="star" cx="1120" cy="70" r="1.6"/>
    <circle class="star s2" cx="1010" cy="290" r="1.2"/><circle class="star s3" cx="760" cy="60" r="1"/>
    <circle class="star" cx="380" cy="300" r="1.1"/><circle class="star s2" cx="1160" cy="200" r="1.3"/>
    <!-- planète + orbite -->
    <circle class="pulse" cx="230" cy="170" r="120" fill="url(#glow)"/>
    <g transform="rotate(-18 230 172)">
      <ellipse cx="230" cy="172" rx="125" ry="40" fill="none" stroke="#00C2FF" stroke-opacity="0.35" stroke-width="5"/>
    </g>
    <circle cx="230" cy="170" r="74" fill="#1E1B4B" stroke="#3a3580" stroke-width="2"/>
    <circle cx="205" cy="140" r="16" fill="#F4F6FF" fill-opacity="0.06"/>
    <g transform="rotate(-18 230 172)">
      <path d="M105 172 A125 40 0 0 0 355 172" fill="none" stroke="#00C2FF" stroke-width="5" stroke-linecap="round"/>
      <!-- satellite en orbite -->
      <circle r="9" fill="#F4F6FF" stroke="#00C2FF" stroke-width="3">
        <animateMotion dur="6s" repeatCount="indefinite" path="M105 172 A125 40 0 1 0 355 172 A125 40 0 1 0 105 172"/>
      </circle>
    </g>
    <text x="196" y="186" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="44" font-weight="700" fill="#00C2FF">&gt;</text>
    <rect class="cursor" x="228" y="178" width="30" height="7" rx="2" fill="#F4F6FF"/>
    <!-- texte -->
    <text x="440" y="160" font-family="Inter, 'Segoe UI', Cantarell, Ubuntu, sans-serif" font-size="88" font-weight="800" fill="url(#title)" letter-spacing="-2">Powernux</text>
    <text x="444" y="210" font-family="Inter, 'Segoe UI', Cantarell, Ubuntu, sans-serif" font-size="26" fill="#c9c7e8">The modular productivity toolkit for Linux</text>
    <g font-family="Inter, 'Segoe UI', Cantarell, Ubuntu, sans-serif" font-size="16" font-weight="600">
      <rect x="444" y="238" width="86" height="30" rx="15" fill="#00C2FF" fill-opacity="0.14" stroke="#00C2FF" stroke-opacity="0.5"/>
      <text x="487" y="258" text-anchor="middle" fill="#7fe0ff">GNOME</text>
      <rect x="540" y="238" width="74" height="30" rx="15" fill="#8B7CFF" fill-opacity="0.16" stroke="#8B7CFF" stroke-opacity="0.5"/>
      <text x="577" y="258" text-anchor="middle" fill="#c4bbff">Rust</text>
      <rect x="624" y="238" width="78" height="30" rx="15" fill="#2EE6A6" fill-opacity="0.14" stroke="#2EE6A6" stroke-opacity="0.5"/>
      <text x="663" y="258" text-anchor="middle" fill="#8ff3cf">Tauri</text>
      <rect x="712" y="238" width="120" height="30" rx="15" fill="#FFB547" fill-opacity="0.14" stroke="#FFB547" stroke-opacity="0.5"/>
      <text x="772" y="258" text-anchor="middle" fill="#ffd391">10 tools</text>
    </g>
    <!-- reflet qui balaie la bannière -->
    <rect x="-400" y="0" width="300" height="340" fill="url(#sweep)" transform="skewX(-20)">
      <animate attributeName="x" from="-400" to="1500" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
