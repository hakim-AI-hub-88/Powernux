[package]
name = "powernux-notes"
version = "1.0.0"
description = "Powernux — module Notes"
authors = ["Es-somid Abdelhakim"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2.5.5"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
