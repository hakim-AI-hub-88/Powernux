[package]
name = "powernux-ai-face"
version = "1.2.0"
description = "Powernux — module AI Face Assistant"
authors = ["Es-somid Abdelhakim"]
edition = "2024"

[dependencies]
powernux-gnome-extension = { path = "../shared/gnome-extension", features = ["secrets"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "json"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
