[package]
name = "powernux-clipboard"
version = "1.1.0"
description = "Powernux — module Clipboard Manager"
authors = ["Es-somid Abdelhakim"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3.7.0", default-features = false }
x11rb = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
