# Publication d'un outil : tag « <outil>-v<version> » (ex. notes-v1.0.1)
#   → compilation sur Ubuntu 24.04 en x86-64 et ARM64, archives signées (Ed25519), Release GitHub,
#   → mise à jour automatique de registry/registry.json sur main (versions, empreintes, signatures).
name: Release tool

on:
  push:
    tags: ["*-v[0-9]*"]

permissions:
  contents: write

# Une seule mise à jour du catalogue à la fois (plusieurs outils peuvent être publiés ensemble).
concurrency:
  group: registry-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ github.ref_name }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - name: Read the tag
        run: |
          TAG="$GITHUB_REF_NAME"
          ID="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          if ! [[ "$ID" =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]] || [ ! -f "tools/$ID/manifest.json" ]; then
            echo "::error::Unknown tool \"$ID\" (expected tools/$ID/manifest.json)"
            exit 1
          fi
          MANIFEST_VERSION=$(node -p "require('./tools/$ID/manifest.json').version")
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag version $VERSION does not match tools/$ID/manifest.json ($MANIFEST_VERSION)"
            exit 1
          fi
          CARGO_DIR="tools/$ID"; [ -d "tools/$ID/src-tauri" ] && CARGO_DIR="tools/$ID/src-tauri"
          { echo "TOOL_ID=$ID"; echo "TOOL_VERSION=$VERSION"; echo "CARGO_DIR=$CARGO_DIR"; } >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev libxdo-dev libdbus-1-dev pkg-config patchelf build-essential

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CARGO_DIR }} -> target
          key: ${{ matrix.runner }}

      - run: npm ci

      - name: Build, sign and package
        env:
          POWERNUX_SIGNING_KEY: ${{ secrets.POWERNUX_SIGNING_KEY }}
          PACKAGE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          if [ -z "$POWERNUX_SIGNING_KEY" ]; then
            echo "::error::Missing secret POWERNUX_SIGNING_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          bash tools/package-tool.sh "$TOOL_ID"
          mkdir -p out
          cp registry/packages/$TOOL_ID-$TOOL_VERSION-linux-*.tar.gz out/
          # Entrée du catalogue pour ce processeur (fusionnée ensuite avec les autres).
          python3 -c "import json,sys; r=json.load(open('registry/registry.json')); \
            json.dump(next(t for t in r['tools'] if t['id']=='$TOOL_ID'), open('out/entry-$(uname -m).json','w'))"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-${{ matrix.runner }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish ${{ github.ref_name }}
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    concurrency:
      group: registry
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/entry-x86_64.json >/dev/null 2>&1 || { echo "::error::The x86-64 build failed: nothing to publish"; exit 1; }
          NAME=$(python3 -c "import json; print(json.load(open('out/entry-x86_64.json'))['name'])")
          VERSION="${GITHUB_REF_NAME##*-v}"
          echo "TOOL_NAME=$NAME" >> "$GITHUB_ENV"
          gh release create "$GITHUB_REF_NAME" out/*.tar.gz \
            --title "$NAME $VERSION" \
            --notes "Tool for Powernux — install or update it from Powernux → Tools Manager." \
            --latest=false

      - name: Update the catalog on main
        run: |
          # Commits au nom du mainteneur (pas de robot dans la liste des contributeurs).
          git config user.name "hakim-AI-hub-88"
          git config user.email "275765637+hakim-AI-hub-88@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -f -B main origin/main
            python3 - out registry/registry.json <<'PY'
          import glob, json, os, sys
          out_dir, target_path = sys.argv[1:]
          entries = [json.load(open(p)) for p in sorted(glob.glob(os.path.join(out_dir, "entry-*.json")))]
          # Métadonnées de la compilation x86-64, archives de tous les processeurs (même version).
          entry = next((e for e in entries if "linux-x86_64" in e.get("packages", {})), entries[0])
          entry["packages"] = {k: v for e in entries for k, v in e.get("packages", {}).items()}
          registry = json.load(open(target_path))
          for i, t in enumerate(registry["tools"]):
              if t["id"] == entry["id"]:
                  registry["tools"][i] = entry
                  break
          else:
              registry["tools"].append(entry)
          with open(target_path, "w") as f:
              json.dump(registry, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print("platforms:", ", ".join(entry["packages"]))
          PY
            git add registry/registry.json
            if git diff --cached --quiet; then echo "Catalog already up to date"; exit 0; fi
            git commit -m "registry: $TOOL_NAME ${GITHUB_REF_NAME##*-v}"
            if git push origin main; then exit 0; fi
            sleep 5
          done
          echo "::error::Could not update registry.json on main"
          exit 1
