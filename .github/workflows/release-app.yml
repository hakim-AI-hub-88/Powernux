# Publication de l'application : tag « v0.11.0 » → .deb, .rpm et .AppImage dans une Release GitHub.
# Compilé sur Ubuntu 24.04 pour fonctionner chez tous les utilisateurs d'Ubuntu 24.04 et plus récents.
name: Release app

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish Powernux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $VERSION (src-tauri/tauri.conf.json)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev libxdo-dev patchelf build-essential curl wget file rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build packages
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: Collect files
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb out/
          cp src-tauri/target/release/bundle/rpm/*.rpm out/
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/
          # Nom fixe : le bouton « Download » du README pointe toujours vers la dernière version.
          cp out/*_amd64.deb out/powernux_amd64.deb
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Powernux $VERSION" \
            --generate-notes \
            --latest
